services:
  web_platform:
    privileged: true
    build:
      context: docker/
      dockerfile: Dockerfile
    container_name: administrador
    restart: always
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
      - ./src/:/var/www/html/
      - ./log/:/var/log/apache2/
    dns:
      - 8.8.8.8
      - 8.8.4.4
    ports:
      - "80:80"
    depends_on:
      - mysql_platform
    networks:
      platform_network:
        aliases:
          - platform_host
        ipv4_address: 172.28.0.9
  frontend_platform:
    build:
      context: ./material-kit-react-main
      dockerfile: Dockerfile.dev
    container_name: frontend
    restart: always
    volumes:
      - ./material-kit-react-main:/app
      - /app/node_modules
    environment:
      - VITE_PROXY_TARGET=http://web_platform
      - VITE_USE_POLLING=true
    ports:
      - "3039:3039"
    depends_on:
      - web_platform
    networks:
      platform_network:
        ipv4_address: 172.28.0.10
  mysql_platform:
    image: mariadb:10
    container_name: administradordb
    ports:
      - "3303:3306"
    volumes:
      - ./mysql-data:/var/lib/mysql
      - ./script/01_base_datos.sql:/docker-entrypoint-initdb.d/01_base_datos.sql:ro
      - ./script/02_migraciones.sql:/docker-entrypoint-initdb.d/02_migraciones.sql:ro
      - ./script/07_proyecto_usuarios.sql:/docker-entrypoint-initdb.d/07_proyecto_usuarios.sql:ro
      - ./script/08_deepseek.sql:/docker-entrypoint-initdb.d/08_deepseek.sql:ro
      - ./script/09_modulos_app.sql:/docker-entrypoint-initdb.d/09_modulos_app.sql:ro
      - ./script/12_home_admin.sql:/docker-entrypoint-initdb.d/12_home_admin.sql:ro
      - ./script/13_home_tema.sql:/docker-entrypoint-initdb.d/13_home_tema.sql:ro
      - ./script/14_logo_animacion.sql:/docker-entrypoint-initdb.d/14_logo_animacion.sql:ro
      - ./script/15_animacion_carga.sql:/docker-entrypoint-initdb.d/15_animacion_carga.sql:ro
      - ./script/16_cuestionarios.sql:/docker-entrypoint-initdb.d/16_cuestionarios.sql:ro
      - ./script/17_carrusel_velocidad.sql:/docker-entrypoint-initdb.d/17_carrusel_velocidad.sql:ro
      - ./script/18_redes_sociales.sql:/docker-entrypoint-initdb.d/18_redes_sociales.sql:ro
      - ./script/19_modal_bienvenida.sql:/docker-entrypoint-initdb.d/19_modal_bienvenida.sql:ro
      - ./script/20_analytics.sql:/docker-entrypoint-initdb.d/20_analytics.sql:ro
      - ./script/21_colaborador.sql:/docker-entrypoint-initdb.d/21_colaborador.sql:ro
      - ./script/22_cliente_module.sql:/docker-entrypoint-initdb.d/22_cliente_module.sql:ro
      - ./script/23_biotipos.sql:/docker-entrypoint-initdb.d/23_biotipos.sql:ro
    environment:
      - MYSQL_ROOT_PASSWORD=Kb.204.h3
      - MYSQL_DATABASE=biotiposUnani
    networks:
      platform_network:
        aliases:
          - platform_db
        ipv4_address: 172.28.0.5
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: platform_phpmyadmin
    links:
      - mysql_platform:mysql_platform
    ports:
      - "8088:80"
    environment:
      - PMA_HOST=mysql_platform
      - PMA_USER=root
      - PMA_PASSWORD=Kb.204.h3
    networks:
      platform_network:
        aliases:
          - phpmyadmin_db
        ipv4_address: 172.28.0.6
networks:
  platform_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
